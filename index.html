<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTools</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Menu</h2>

        <ul>
          <li><a href="#color-converter">Color Converter</a></li>
          <li><a href="#json-formatter">JSON Formatter</a></li>
          <li><a href="#uuid-generator">UUID Generator</a></li>
          <li><a href="#base64">Base 64</a></li>
        </ul>
      </aside>

      <main id="app">
        <section id="color-converter" class="tool">
          <h1>Color Converter</h1>

          <!-- conteúdo do conversor de cores -->

          <div class="converter">
            <div class="row">
              <div class="field">
                <label for="input-format">Input Format:</label>
                <select id="input-format">
                  <option value="hex" selected>HEX</option>
                  <option value="rgb">RGB</option>
                  <option value="hsl">HSL</option>
                </select>
              </div>

              <div class="field">
                <label for="output-format">Output Format:</label>
                <select id="output-format">
                  <option value="hex">HEX</option>
                  <option value="rgb" selected>RGB</option>
                  <option value="hsl">HSL</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="color-input">Color Value:</label>
              <input id="color-input" placeholder="#ff8800" />
            </div>

            <button class="convert-color-btn" id="convert-btn">Convert</button>
            <div class="result" id="result" hidden>
              <div class="color-preview" id="color-preview"></div>
              <p id="color-output"></p>
              <button class="copy-btn" id="copy-btn">Copy</button>
            </div>
          </div>
        </section>

        <section id="json-formatter" class="tool">
          <h1>JSON Formatter</h1>
          <!-- conteúdo do JSON -->

          <div class="json-panel">
            <div class="field">
              <label for="json-input">Input:</label>
              <textarea
                id="json-input"
                placeholder='{"name":"William","age":32}'
                spellcheck="false"
              ></textarea>
            </div>

            <div class="json-actions">
              <select id="json-indent">
                <option value="2" selected>2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="tab">Tab</option>
              </select>

              <button class="json-btn" id="json-format-btn">Format</button>
              <button class="json-btn" id="json-minify-btn">Minify</button>
              <button class="json-btn" id="json-clear-btn">Clear</button>
            </div>

            <p class="json-error" id="json-error" hidden></p>

            <div class="field">
              <label for="json-output">Output:</label>
              <textarea id="json-output" readonly spellcheck="false"></textarea>
            </div>

            <button class="json-btn" id="json-copy-btn">Copy</button>
          </div>
        </section>

        <section id="uuid-generator" class="tool">
          <h1>UUID Generator</h1>
          <!-- conteúdo do UUID -->

          <div class="json-panel">
            <div class="uuid-options">
              <div class="field">
                <label for="uuid-count">How many:</label>
                <input
                  type="number"
                  id="uuid-count"
                  min="1"
                  max="50"
                  value="1"
                />
              </div>

              <label class="check">
                <input type="checkbox" id="uuid-uppercase" /> Uppercase
              </label>

              <label class="check">
                <input type="checkbox" id="uuid-hyphens" checked /> Hyphens
              </label>
            </div>

            <div class="uuid-actions">
              <button class="json-btn" id="uuid-generate-btn">Generate</button>
              <button class="json-btn" id="uuid-copy-btn">Copy all</button>
            </div>

            <textarea id="uuid-output" readonly spellcheck="false"></textarea>
          </div>
        </section>

        <section id="base64" class="tool">
          <h1>Base 64</h1>
          <!-- conteúdo do Base 64 -->

          <div class="json-panel">
            <div class="field">
              <label for="b64-input">Input:</label>
              <textarea
                id="b64-input"
                placeholder="Hello, World!"
                spellcheck="false"
              ></textarea>
            </div>

            <div class="json-actions">
              <button class="json-btn" id="b64-encode-btn">Encode</button>
              <button class="json-btn" id="b64-decode-btn">Decode</button>
              <button class="json-btn" id="b64-clear-btn">Clear</button>

              <label class="check">
                <input type="checkbox" id="b64-urlsafe" /> URL-safe
              </label>
            </div>

            <p class="json-error" id="b64-error" hidden></p>

            <div class="field">
              <label for="b64-output">Output:</label>
              <textarea id="b64-output" readonly spellcheck="false"></textarea>
            </div>

            <button class="json-btn" id="b64-copy-btn">Copy</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
